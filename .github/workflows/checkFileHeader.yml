# Check that the file headers match bin/beamFoamUpdateHeaders
name: Checking file headers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-headers:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check file headers
        run: git ls-files -z | xargs -0 bin/beamFoamUpdateHeaders -check
