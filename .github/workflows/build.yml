# Build the solver and run the tutorial regression tests using Docker
# containers
name: Building beamFoam

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        container-image:
          - name: "OpenFOAM-v2312"
            image: "opencfd/openfoam-dev:2312"
            source: "/usr/lib/openfoam/openfoam2312/etc/bashrc"
            buildflags: "-j"

    container:
      image: ${{ matrix.container-image.image }}

    steps:
      - name: Install git and python3 on container
        run: |
          apt update
          apt install -y git python3
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source OpenFOAM environment and compiling beamFoam
        shell: bash -l {0}
        run: |
          echo "Using OpenFOAM version: ${{ matrix.container-image.name }}"
          source ${{ matrix.container-image.source }}

          # Compile beamFoam
          ./Allwmake -j

      - name: Run the tutorial regression tests
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          tutorials/Alltest-regression -j 4

      - name: Upload the regression test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-logs.${{ matrix.container-image.name }}
          path: |
            tutorialsTest-regression/*.log
            tutorialsTest-regression/*/log.*
            tutorialsTest-regression/*/postProcessing/**
          if-no-files-found: ignore
          retention-days: 14
